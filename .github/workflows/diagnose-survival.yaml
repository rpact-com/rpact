name: diagnose-survival

on:
  pull_request:
    branches: [main, 'dev/*']
    paths:
      - '.github/workflows/diagnose-survival.yaml'
      - 'src/**'
      - 'R/**'
      - '.github/scripts/diagnose-survival.R'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'daniel-bugfixes'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rpact-com/rpact.tests
          # Same tests as the failing coverage run, independent of later updates.
          ref: 28b667cb4820805207513cb3b80691eebd4d33af
          token: ${{ secrets.RPACT_TESTS_ACCESS_TOKEN }}
          path: private-tests
          sparse-checkout: |
            tests
            scripts
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
          Ncpus: 4
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::emmeans
          needs: coverage
      - name: Record environment
        shell: Rscript {0}
        run: |
          print(sessionInfo())
          print(RNGkind())
          print(packageVersion("Rcpp"))
          system("g++ --version")
          system("gfortran --version")
      - name: Reuse the original failing coverage installation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 40078617937 --repo rpact-com/rpact \
            --name coverage-test-failures --dir "$RUNNER_TEMP/probe-library"
      - name: Capture the first regression case
        env:
          R_LIBS_USER: ${{ runner.temp }}/probe-library:${{ env.R_LIBS_USER }}
          RPACT_LOG_LEVEL: DISABLED
        run: Rscript --vanilla .github/scripts/diagnose-survival.R "$RUNNER_TEMP/linux-probe.rds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-trace
          path: ${{ runner.temp }}/linux-probe.rds
