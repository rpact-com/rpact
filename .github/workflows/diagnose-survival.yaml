name: diagnose-survival

on:
  pull_request:
    branches: [main, 'dev/*']
    paths:
      - '.github/workflows/diagnose-survival.yaml'
      - 'src/**'
      - 'R/**'
      - '.github/scripts/diagnose-survival.R'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'daniel-bugfixes'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TESTTHAT_PARALLEL: 'TRUE'
      TESTTHAT_CPUS: '4'
      RPACT_COMPLETE_UNIT_TEST_SET_ENABLED: 'TRUE'
      RPACT_LOG_LEVEL: DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rpact-com/rpact.tests
          # Pin the paired tests, including the portable sampler baselines.
          ref: 24056ce1ba7432eea294d3427c346cb09a932205
          token: ${{ secrets.RPACT_TESTS_ACCESS_TOKEN }}
          path: private-tests
          sparse-checkout: |
            tests
            scripts
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
          Ncpus: 4
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::emmeans
          needs: coverage
      - name: Record environment
        shell: Rscript {0}
        run: |
          print(sessionInfo())
          print(RNGkind())
          print(packageVersion("Rcpp"))
          system("g++ --version")
          system("gfortran --version")
      - name: Add the focused private tests
        shell: bash
        run: |
          cp -R private-tests/tests/testthat/. tests/testthat/
          find tests/testthat -maxdepth 1 -name 'test-*.R' \
            ! -name 'test-f_simulation_subgroup_sampling.R' \
            ! -name 'test-f_simulation_enrichment_survival_patient_wise.R' \
            ! -name 'test-f_simulation_enrichment_survival_patient_wise_compare_basic.R' -delete
      - name: Verify portable sampling with coverage at O0
        shell: Rscript {0}
        run: |
          configPath <- file.path(Sys.getenv("RUNNER_TEMP"), "rpact-test-config")
          dir.create(configPath, showWarnings = FALSE)
          Sys.setenv(RPACT_CONFIG_DIR_LOAD = configPath, RPACT_CONFIG_DIR_SAVE = configPath)
          coverage <- covr::package_coverage(
            quiet = FALSE, clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
          print(covr::percent_coverage(coverage))
      - name: Show test output
        if: always()
        run: find "$RUNNER_TEMP/package" -name 'testthat.Rout*' -exec cat '{}' \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portable-sampler-failures
          path: ${{ runner.temp }}/package
